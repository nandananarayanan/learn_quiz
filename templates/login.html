{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Quiz App</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-800: #1e293b;
        }

        body {
            background: linear-gradient(135deg, #f0f2ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
            overflow: hidden;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header i {
            font-size: 3.5rem;
            margin-bottom: 16px;
            opacity: 0.95;
        }

        .login-header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .login-header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .login-body {
            padding: 45px 40px;
        }

        .form-control {
            height: 56px;
            border-radius: 16px;
            border: 2px solid var(--gray-200);
            padding: 0 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            transform: translateY(-1px);
        }

        .form-label {
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 10px;
        }

        .btn-login {
            height: 56px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3);
        }

        .extra-links a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gray-200);
        }

        .divider span {
            background: white;
            padding: 0 20px;
        }

        .register-text {
            font-size: 1rem;
            color: #64748b;
        }

        .register-text a {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="login-card">

            <!-- Header -->
            <div class="login-header">
                <i class="fas fa-graduation-cap"></i>
                <h1>Quiz App</h1>
                <p>Master concepts. Ace your exams.</p>
            </div>

            <!-- Form Body -->
            <div class="login-body">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-4" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-user me-2 text-primary"></i>Username
                        </label>
                        {{ form.username }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-lock me-2 text-primary"></i>Password
                        </label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100">
                        <i class="fas fa-arrow-right me-2"></i> Login to Dashboard
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'password_reset' %}">
                        <i class="fas fa-key me-1"></i> Forgot your password?
                    </a>
                </div>

                <div class="divider"><span>or</span></div>

                <div class="text-center register-text">
                    New here? 
                    <a href="{% url 'signup' %}">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
