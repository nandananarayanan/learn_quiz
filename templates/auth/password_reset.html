{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password • Quiz App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-light: #818cf8; 
        }
        body { 
            background: linear-gradient(135deg, #f0f2ff 0%, #e0e7ff 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
        }
        .card { 
            max-width: 460px; 
            width: 100%; 
            background: white; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(99,102,241,0.15); 
            overflow: hidden; 
            border: 1px solid rgba(99,102,241,0.1); 
        }
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            color: white; 
            text-align: center; 
            padding: 40px 20px; 
        }
        .header i { 
            font-size: 3.5rem; 
            margin-bottom: 16px; 
            opacity: 0.95;
        }
        .header h1 { 
            font-size: 2rem; 
            font-weight: 800; 
            margin: 0; 
        }
        .header p { 
            margin: 10px 0 0; 
            opacity: 0.9; 
            font-size: 0.95rem;
        }
        .body { 
            padding: 45px; 
        }
        input[type="password"], 
        input[type="text"] { 
            width: 100%; 
            height: 56px; 
            border-radius: 14px; 
            border: 2px solid #e2e8f0; 
            padding: 0 20px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1); 
        }
        label { 
            font-weight: 600; 
            color: #1e293b; 
            margin-bottom: 10px; 
            display: block; 
            font-size: 0.95rem;
        }
        label i {
            margin-right: 8px;
            color: var(--primary);
            width: 16px;
        }
        .btn { 
            height: 56px; 
            border-radius: 14px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            border: none; 
            width: 100%; 
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), #4f46e5); 
            color: white;
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px rgba(99,102,241,0.3); 
        }
        .text-center a { 
            color: var(--primary); 
            font-weight: 600; 
            text-decoration: none; 
            transition: all 0.2s ease;
        }
        .text-center a:hover { 
            text-decoration: underline; 
            color: #4f46e5;
        }
        .alert { 
            border-radius: 12px; 
            padding: 14px 18px; 
            margin-bottom: 24px;
            border: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert i {
            font-size: 1.1rem;
        }
        .alert-danger { 
            background: #fee2e2; 
            color: #991b1b; 
        }
        .alert-success { 
            background: #dcfce7; 
            color: #166534; 
        }
        .password-requirements {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
            padding-left: 4px;
        }
        .password-requirements i {
            margin-right: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .back-link i {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <i class="fas fa-key"></i>
            <h1>Reset Password</h1>
            <p>Enter your username and new password</p>
        </div>
        <div class="body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        <i class="fas fa-{% if message.tags == 'error' or message.tags == 'danger' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           placeholder="Enter your username"
                           required
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="new_password1">
                        <i class="fas fa-lock"></i>New Password
                    </label>
                    <input type="password" 
                           id="new_password1" 
                           name="new_password1" 
                           placeholder="Enter new password"
                           required
                           autocomplete="new-password">
                    <div class="password-requirements">
                        <i class="fas fa-info-circle"></i>
                        Must be at least 8 characters long
                    </div>
                </div>

                <div class="form-group">
                    <label for="new_password2">
                        <i class="fas fa-lock"></i>Confirm Password
                    </label>
                    <input type="password" 
                           id="new_password2" 
                           name="new_password2" 
                           placeholder="Confirm new password"
                           required
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary mb-3">
                    <i class="fas fa-check"></i> Reset Password
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Login</span>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
