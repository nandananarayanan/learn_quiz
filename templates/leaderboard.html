{% extends "base.html" %}
{% block content %}

<div class="container my-5">
    <h2 class="text-center mb-4">Leaderboard</h2>

    <div class="table-responsive">
        <table class="table table-striped table-bordered text-center align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Rank</th>
                    <th>Student</th>
                    <th>Score</th>
                    <th>Completed At</th>
                </tr>
            </thead>
            <tbody>
                {% for result in results %}
                <tr 
                    {% if result.rank == 1 %} style="background-color: #FFD700; font-weight: bold;" {% endif %}
                    {% if result.rank == 2 %} style="background-color: #C0C0C0; font-weight: bold;" {% endif %}
                    {% if result.rank == 3 %} style="background-color: #CD7F32; font-weight: bold;" {% endif %}
                >
                    <td>{{ result.rank }}</td>
                    <td>{{ result.user.username }}</td>
                    <td>{{ result.score }}</td>
                    <td>{{ result.completed_at|date:"Y-m-d H:i" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No attempts yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="{% url 'home' %}" class="btn btn-primary">Back</a>
    </div>
</div>

{% endblock %}
